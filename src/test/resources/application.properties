spring.profiles.active=test
spring.datasource.url=${TEST_DB_URL:jdbc:h2:mem:cinemaai_test;MODE=PostgreSQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1}
spring.datasource.username=${TEST_DB_USERNAME:sa}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.datasource.driver-class-name=${TEST_DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=${TEST_JPA_DDL_AUTO:create-drop}
spring.jpa.show-sql=${TEST_JPA_SHOW_SQL:false}
spring.flyway.enabled=${TEST_FLYWAY_ENABLED:false}
spring.ai.openai.api-key=${TEST_OPENAI_API_KEY:}
app.jwt.secret=${TEST_JWT_SECRET:cinemaai-test-jwt-secret-placeholder-123456789}
app.jwt.access-expiration-ms=${TEST_JWT_ACCESS_EXPIRATION_MS:1800000}
app.jwt.refresh-expiration-ms=${TEST_JWT_REFRESH_EXPIRATION_MS:604800000}
app.booking.hold-cleanup.enabled=${TEST_BOOKING_HOLD_CLEANUP_ENABLED:false}
app.showtime.scheduler.enabled=${TEST_SHOWTIME_SCHEDULER_ENABLED:false}
app.payment.success-redirect-url=${TEST_PAYMENT_SUCCESS_REDIRECT_URL:http://localhost:3000/payment-callback}
app.google.client-id=${TEST_GOOGLE_OAUTH_CLIENT_ID:}
app.google.token-info-base-url=${TEST_GOOGLE_TOKEN_INFO_BASE_URL:https://oauth2.googleapis.com}
app.cors.allowed-origins=${TEST_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.cors.allowed-methods=${TEST_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
app.cors.allowed-headers=${TEST_CORS_ALLOWED_HEADERS:*}
app.cors.allow-credentials=${TEST_CORS_ALLOW_CREDENTIALS:true}
app.upload.cloudinary-folder-prefix=${TEST_UPLOAD_CLOUDINARY_FOLDER_PREFIX:cinema-ai}
app.upload.default-image-folder=${TEST_UPLOAD_DEFAULT_IMAGE_FOLDER:images}
vnpay.tmn-code=${TEST_VNPAY_TMN_CODE:TEST_TMN}
vnpay.hash-secret=${TEST_VNPAY_HASH_SECRET:TEST_HASH_SECRET}
vnpay.api-url=${TEST_VNPAY_API_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.api-query-url=${TEST_VNPAY_API_QUERY_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
vnpay.return-url=${TEST_VNPAY_RETURN_URL:http://localhost:8080/api/v1/payments/vnpay/return}
vnpay.ipn-url=${TEST_VNPAY_IPN_URL:http://localhost:8080/api/v1/payments/vnpay/ipn}
vnpay.default-client-ip=${TEST_VNPAY_DEFAULT_CLIENT_IP:127.0.0.1}
