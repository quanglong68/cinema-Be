# ===============================
# Application
# ===============================
spring.application.name=${APP_NAME}
spring.config.import=optional:file:.env[.properties],optional:file:cinemaAI/.env[.properties],optional:file:BE/cinemaAI/.env[.properties],optional:dotenv:.env
server.port=${SERVER_PORT}

# ===============================
# CORS
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.cors.allowed-methods=${CORS_ALLOWED_METHODS}
app.cors.allowed-headers=${CORS_ALLOWED_HEADERS}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS}


# ===============================
# Database - PostgreSQL
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}

# ===============================
# HikariCP Connection Pool
# ===============================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.connection-test-query=SELECT 1

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL}
spring.jpa.database-platform=${JPA_DATABASE_PLATFORM}
spring.jpa.open-in-view=false
spring.cache.type=simple
spring.cache.cache-names=publicMovies,publicMovieDetails

spring.flyway.enabled=${FLYWAY_ENABLED}


# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS}
management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS}
management.health.mail.enabled=${HEALTH_MAIL_ENABLED}


# ===============================
# Swagger / SpringDoc
# ===============================
springdoc.api-docs.path=${SPRINGDOC_API_DOCS_PATH}
springdoc.swagger-ui.path=${SPRINGDOC_SWAGGER_UI_PATH}
springdoc.swagger-ui.tags-sorter=${SPRINGDOC_TAGS_SORTER}
springdoc.swagger-ui.operations-sorter=${SPRINGDOC_OPERATIONS_SORTER}
springdoc.swagger-ui.display-request-duration=${SPRINGDOC_DISPLAY_REQUEST_DURATION}


# ===============================
# Spring AI / OpenAI
# ===============================
spring.ai.openai.api-key=${OPENAI_API_KEY}


# ===============================
# Mail - Gmail SMTP
# ===============================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE}

app.mail.enabled=${MAIL_ENABLED}
app.mail.from=${MAIL_FROM}


# ===============================
# VNPay
# ==============================
vnpay.tmn-code=${VNPAY_TMN_CODE}
vnpay.hash-secret=${VNPAY_HASH_SECRET}
vnpay.api-url=${VNPAY_API_URL}
vnpay.api-query-url=${VNPAY_API_QUERY_URL}
vnpay.return-url=${VNPAY_RETURN_URL}
vnpay.ipn-url=${VNPAY_IPN_URL}
vnpay.default-client-ip=${VNPAY_DEFAULT_CLIENT_IP}

app.payment.success-redirect-url=${PAYMENT_SUCCESS_REDIRECT_URL}


# ===============================
# JWT
# ===============================
app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS}


# ===============================
# Google OAuth
# ===============================
app.google.client-id=${GOOGLE_OAUTH_CLIENT_ID}
app.google.token-info-base-url=${GOOGLE_TOKEN_INFO_BASE_URL}


# ===============================
# Booking Hold Cleanup
# ===============================
app.booking.hold-cleanup.enabled=${BOOKING_HOLD_CLEANUP_ENABLED}
app.booking.hold-cleanup.fixed-delay-ms=${BOOKING_HOLD_CLEANUP_FIXED_DELAY_MS}

# Standalone concession payment expiry
app.food-order.payment-cleanup.enabled=${FOOD_ORDER_PAYMENT_CLEANUP_ENABLED:true}
app.food-order.payment-cleanup.fixed-delay-ms=${FOOD_ORDER_PAYMENT_CLEANUP_FIXED_DELAY_MS:60000}


# ===============================
# Cloudinary
# ===============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}


# ===============================
# Multipart Upload
# ===============================
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE}


# ===============================
# Recommendation System Weights
# ===============================
app.recommendation.weights.trailer-complete=${REC_W_TRAILER_COMPLETE}
app.recommendation.weights.trailer-view-max=${REC_W_TRAILER_VIEW_MAX}
app.recommendation.weights.trailer-click=${REC_W_TRAILER_CLICK}
app.recommendation.weights.trailer-skip=${REC_W_TRAILER_SKIP}

app.recommendation.weights.booking=${REC_W_BOOKING}
app.recommendation.weights.ticket-count-max=${REC_W_TICKET_COUNT_MAX}
app.recommendation.weights.ticket-count-saturation=${REC_W_TICKET_COUNT_SATURATION}

app.recommendation.weights.review-high-multiplier=${REC_W_REVIEW_HIGH_MULT}
app.recommendation.weights.review-low-cap=${REC_W_REVIEW_LOW_CAP}

app.recommendation.weights.wishlist=${REC_W_WISHLIST}

app.recommendation.weights.actor-multiplier=${REC_W_ACTOR_MULT}
app.recommendation.weights.director-multiplier=${REC_W_DIRECTOR_MULT}
app.recommendation.weights.recency-bonus=${REC_W_RECENCY_BONUS}
app.recommendation.weights.recency-months=${REC_W_RECENCY_MONTHS}


# ===============================
# Seed Accounts
# ===============================
app.seed.admin.email=${SEED_ADMIN_EMAIL}
app.seed.admin.password=${SEED_ADMIN_PASSWORD}
app.seed.admin.full-name=${SEED_ADMIN_FULL_NAME}
app.seed.admin.phone=${SEED_ADMIN_PHONE}

app.seed.staff.email=${SEED_STAFF_EMAIL}
app.seed.staff.password=${SEED_STAFF_PASSWORD}
app.seed.staff.full-name=${SEED_STAFF_FULL_NAME}
app.seed.staff.phone=${SEED_STAFF_PHONE}


# ===============================
# AI Service
# ===============================
ai.url=${AI_URL}
# Bulk Refund Configuration
cinema.bulk-refund.enable=true
cinema.bulk-refund.retry-max-attempts=3
cinema.bulk-refund.retry-delay-seconds=60
cinema.bulk-refund.notification-enabled=true
cinema.vnpay.bulk-refund-timeout-seconds=30
cinema.vnpay.bulk-refund-batch-size=10
